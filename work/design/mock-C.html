  --stone:#17161b;--stone2:#2a2730;--oak:#35261a;--oak2:#4a3521;--oak3:#22170e;--iron:#6b6a70;--iron2:#3d3c42;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0a0d;overflow:hidden}
body{padding:4px;font-family:var(--body);color:var(--fg);-webkit-font-smoothing:antialiased;font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.win{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:5px;padding:9px;border:3px solid #000;border-radius:6px;
  background:linear-gradient(180deg,#6e4d2c,#4f3822 32%,#35261a);box-shadow:inset 0 0 0 1px var(--brass3),inset 0 2px 0 rgba(255,255,255,.14),0 0 0 1px #000;position:relative}
.hdr{height:44px;flex:none;display:flex;align-items:center;gap:6px}
.hb{min-width:44px;height:40px;border-radius:4px;padding:0 6px;line-height:1.15;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;
  background:linear-gradient(180deg,#7a5a35,#4f3822);box-shadow:inset 0 0 0 1px var(--brass3),inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 #000;display:grid;place-items:center}
.hb.on{background:linear-gradient(180deg,#8f6c3c,#5d4226);box-shadow:inset 0 0 0 1px var(--brass2),0 2px 0 #000;color:var(--brass2)}
.ch{white-space:nowrap;margin-right:auto;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;color:#d9c18c;padding-left:2px}.ch i{color:var(--danger);font-style:normal;font-size:12px}
/* the oak clipboard and its context sheet */
.clip{flex:none;position:relative;border:2px solid #000;border-radius:5px;background:linear-gradient(180deg,#3a2a1b,#2a1d12);box-shadow:inset 0 0 0 1px var(--brass3);padding:18px 7px 7px}
.clip:before{content:"";position:absolute;left:50%;top:-5px;width:112px;height:26px;margin-left:-56px;border-radius:5px;border:2px solid #000;background:linear-gradient(180deg,#f0d27a,#c9a24a 55%,#7d5f22);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 rgba(0,0,0,.6);z-index:2}
.clip:after{content:"";position:absolute;left:50%;top:5px;width:74px;height:6px;margin-left:-37px;border-radius:3px;background:#2b1d10;z-index:3}
.site{position:absolute;top:1px;left:10px;right:10px;display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.12em;color:#c9b07a}
.sheet{background:linear-gradient(180deg,#f3e7c8,#e9d9b2);color:var(--ink);border:1px solid #8c7748;padding:8px 10px 7px;position:relative;
  background-image:linear-gradient(180deg,#f3e7c8,#e9d9b2),repeating-linear-gradient(0deg,transparent 0 21px,rgba(107,86,52,.18) 21px 22px)}
.sheet h2{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase;border-bottom:1px solid #8c7748;padding-bottom:3px;display:flex;justify-content:space-between}
.sheet h3{font-family:var(--body);font-style:italic;font-weight:700;font-size:17px;color:#33506b;margin:4px 0 2px;line-height:1.1}
.reg{list-style:none;display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.reg li{display:flex;align-items:baseline;gap:5px;height:22px;font-style:italic;font-weight:500;font-size:15px;color:#3a3a40;position:relative;transition:opacity .3s}
.reg li i{width:9px;height:9px;flex:none;border:1px solid #2b1d10;align-self:center;border-radius:1px}
.reg li b{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:#33506b}
.reg li s{position:absolute;left:0;right:0;top:11px;height:2px;background:#b3261e;transform:scaleX(0);transform-origin:left;border-radius:2px;text-decoration:none;transition:transform .35s ease-out}
.reg li.out{opacity:.5}.reg li.out s{transform:scaleX(1) rotate(-1.2deg)}
.reg li.hit{color:#1d5a2a}.reg li.hit b{color:#1d5a2a}
.reg li em{font-style:italic;font-weight:700;color:#b3261e;font-size:14px;margin-left:3px}
.note{font-size:11.5px;font-style:italic;color:var(--ink2);margin-top:3px;line-height:1.25;min-height:28px}
/* the stage */
.stage{flex:1;min-height:0;position:relative;border:2px solid #000;box-shadow:inset 0 0 0 1px var(--brass3);overflow:hidden;background:#0d0a08;touch-action:none}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.pix{shape-rendering:crispEdges}
.cap{flex:none;min-height:40px;display:grid;place-items:center;text-align:center;padding:5px 10px;background:#0c0906;border:2px solid #000;box-shadow:inset 0 0 0 1px #4a3521;font-style:italic;font-size:14.5px;color:#eadfc4;line-height:1.2}
/* the finds tray */
.tray{flex:none;display:flex;gap:6px;padding:8px 7px;border:2px solid #000;border-radius:5px;background:#b9a274;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 0 1px #6b5634,inset 0 0 12px rgba(60,40,10,.5)}
.tb{flex:1;min-height:58px;border-radius:4px;border:1.5px dashed #5a4526;background:rgba(88,68,36,.82);color:#f6ecd2;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .06s,filter .15s;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.tb small{font-family:var(--body);font-style:italic;font-weight:500;font-size:12px;letter-spacing:0;color:#e8d9b0}
.tb:active{transform:translateY(2px)}.tb.go{background:rgba(120,52,44,.9);border-color:#f0d27a;box-shadow:0 0 0 2px rgba(240,210,122,.35),0 2px 0 rgba(0,0,0,.45)}
.tb.sm{flex:0 0 92px;font-size:10.5px;background:rgba(60,46,24,.8)}.tb[disabled]{filter:saturate(.3) brightness(.7);pointer-events:none}
/* the finds tag (result) */
.tag{position:absolute;left:50%;top:3%;width:230px;margin-left:-115px;background:linear-gradient(180deg,#f6ecd0,#e6d5ab);color:var(--ink);border:1.5px solid #5a4526;border-top:7px solid var(--tc,#c9a24a);
  padding:15px 12px 9px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.45),0 14px 30px rgba(0,0,0,.6);transform:translateY(-140%) rotate(-7deg);opacity:0;z-index:5;clip-path:polygon(12% 0,88% 0,100% 12%,100% 100%,0 100%,0 12%)}
.tag:before{content:"";position:absolute;left:50%;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#1b120a;box-shadow:0 0 0 2px #c9a24a}
.tag.show{opacity:1;transform:translateY(0) rotate(-2deg);transition:transform .42s cubic-bezier(.2,1.5,.4,1),opacity .15s}
.tag u{display:block;text-decoration:none;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--ink2)}
.tag b{display:block;font-family:var(--display);font-weight:900;font-size:24px;line-height:1.1;margin:3px 0 2px;color:var(--tk,#2b1d10)}
.tag span{display:block;font-style:italic;font-size:13.5px;line-height:1.25;color:#4a3a22}
.stage .tag .ico{position:static;width:48px;height:48px;margin:3px auto 0;display:block}
.stamp{position:absolute;right:7px;top:14px;font-family:var(--display);font-weight:900;font-size:10px;letter-spacing:.1em;color:#b3261e;border:2px solid #b3261e;padding:1px 5px;border-radius:3px;transform:rotate(-9deg) scale(2.2);opacity:0}
.tag.show .stamp{opacity:.85;transform:rotate(-9deg) scale(1);transition:transform .16s .45s cubic-bezier(.3,1.6,.5,1),opacity .05s .45s}
body.rm *{transition-duration:.01s!important;animation-duration:.01s!important}
@keyframes flick{0%,100%{opacity:.92}40%{opacity:1}55%{opacity:.84}70%{opacity:.97}}
body:not(.rm) .flick{animation:flick 1.7s infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
body:not(.rm) .shake{animation:shake .22s 2}
#scene{position:absolute;inset:0}.tag{top:auto;bottom:4%}

<div class="clip"><div class="site"></div><div class="sheet"><h2></h2><h3 id="ttl"></h3><ul class="reg" aria-label="Chances, printed before you start"></ul><p class="note" id="note"></p></div></div>
<div class="stage" id="stage"><div id="scene"></div><div class="tag" role="status"></div></div>
<div class="cap" role="status"></div>
<div class="tray"><button class="tb go" id="act"></button><button class="tb sm" id="again">AGAIN<small>reset the mock</small></button></div>
</div><script>// shared by the three luck mocks: the tables (same chances as the build), pixel icons, sound, haptics, the result tag
const TABLES={
 sarc:{site:'CTX 214 · E4/N7',h2:['Burial record','sarcophagus'],rows:[
  {k:'relic',n:'A relic',p:20,g:'gold',side:'L',col:'#ff9a1f',t:'A relic',d:'Catalogue it before anyone else does.'},
  {k:'ore',n:'Ore',p:25,g:'teal',side:'L',col:'#4fe3d6',t:'Ore',d:'Into the pouch. Use it or lose it at the next collapse.'},
  {k:'bones',n:'Bones',p:30,g:'pale',side:'R',col:'#cfcfcf',t:'Bones',d:'The occupant. Recorded, respectfully, as nothing.'},
  {k:'mimic',n:'A mimic',p:15,g:'gold',side:'R',col:'#d8383f',t:'A mimic',d:'The lid bites back. The wall takes the blame.'},
  {k:'memory',n:'A Memory',p:10,g:'pale',side:'R',col:'#b24b9c',t:'A Memory',d:'One more collapse you are allowed to survive.'}]},
 fever:{site:'CTX 231 · NICHE',h2:['Fourth Fever','sealed niche'],rows:[
  {k:'relic',n:'A relic',p:30,g:'gold',side:'L',col:'#ff9a1f',t:'A relic',d:'The niche was worth sealing, then.'},
  {k:'ore',n:'Ore',p:25,g:'teal',side:'L',col:'#4fe3d6',t:'Ore',d:'Into the pouch.'},
  {k:'points',n:'500 points',p:10,g:'gold',side:'L',col:'#f2c14e',t:'500 points',d:'Grave goods, loose. Banked as found.'},
  {k:'memory',n:'A Memory',p:10,g:'pale',side:'R',col:'#b24b9c',t:'A Memory',d:'One more collapse you are allowed to survive.'},
  {k:'nothing',n:'Nothing',p:25,g:'pale',side:'R',col:'#8a8a8a',t:'Nothing',d:'Robbed in antiquity. Noted without comment.'}]}};
const PAL={'.':null,k:'#1b120a',w:'#f4efe0',g:'#c9c2ad',s:'#8f887a',y:'#f2c14e',o:'#ff9a1f',b:'#7d5f22',t:'#4fe3d6',c:'#1d7a68',q:'#d6fffb',r:'#d8383f',m:'#7a1f27',p:'#b24b9c',h:'#ef8fd9',d:'#3a2a1b',e:'#5a4526'};
const ICON={
 relic:['....kkkk....','..kkyyyykk..','.kyyoooyyyk.','.kyokyykoyk.','kyyokyykoyyk','kyyyyyyyyyyk','kyybyyyybyyk','.kyybbbbyyk.','.kyyyyyyyyk.','..kybyybyk..','...kyyyyk...','....kkkk....'],
 ore:['.....kk.....','....kqtk....','...kqttck...','..kqtttcck..','.kqtttttcck.','kqtttqttccck','kttttqttcckk','.kttttttck..','..ktttcck...','...kttck....','....kck.....','.....k......'],
 bones:['...kkkkkk...','..kwwwwwwk..','.kwwwwwwwwk.','.kwkkwwkkwk.','.kwkkwwkkwk.','.kwwwkkwwwk.','..kwwwwwwk..','..kwkwkwkk..','k..kkkkkk..k','wkk......kkw','.kwwkkkkwwk.','kwk......kwk'],
 mimic:['kkkkkkkkkkkk','kddddddddddk','kdyddddddydk','kddddddddddk','kwkwkwkwkwkk','krrrrrrrrrrk','krmmrrrrmmrk','kkwkwkwkwkwk','keeeeeeeeeek','keeeyyyyeeek','keeeeeeeeeek','kkkkkkkkkkkk'],
 memory:['............','..kkk..kkk..','.kphhkkpppk.','kphhppppppk.','kphpppppppk.','kpppppppppk.','.kpppppppk..','..kpppppk...','...kpppk....','....kpk.....','.....k......','............'],
 points:['............','....kkkk....','..kkyyyykk..','.kyyyooyyyk.','.kyyoyyoyyk.','.kyyoyyyyyk.','.kyyoyyoyyk.','.kyyyooyyyk.','..kkyyyykk..','....kkkk....','............','............'],
 nothing:['............','............','..kk....kk..','.kssk..kssk.','..kk....kk..','............','............','.kssssssssk.','..kkkkkkkk..','............','............','............']};
function pix(k,s,x,y,sil){const m=ICON[k];let o='<g class="pix" transform="translate('+(x||0)+','+(y||0)+')">';for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){const ch=m[r][c];if(ch==='.')continue;o+='<rect x="'+c*s+'" y="'+r*s+'" width="'+(s+.3)+'" height="'+(s+.3)+'" fill="'+(sil||PAL[ch])+'"/>'}return o+'</g>'}
const Q=new URLSearchParams(location.search);let MODE=Q.get('m')==='fever'?'fever':'sarc',FORCE=Q.get('o')||null;
if(Q.get('rm')||matchMedia('(prefers-reduced-motion:reduce)').matches)document.body.classList.add('rm');
const RM=()=>document.body.classList.contains('rm'),$=s=>document.querySelector(s),T=()=>TABLES[MODE];
function roll(){const t=T().rows;if(FORCE){const f=t.find(r=>r.k===FORCE);if(f)return f}let x=Math.random()*100;for(const r of t){if(x<r.p)return r;x-=r.p}return t[t.length-1]}
// --- sound (WebAudio, made on first tap) and haptics
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,d,type,v,slide){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}
function noise(d,f,v,q){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q||1;g.gain.value=v||.12;s.buffer=b;s.connect(fl).connect(g).connect(a.destination);s.start()}
const SFX={creak:()=>{tone(90,.5,'sawtooth',.05,140);noise(.45,420,.05,6)},grind:()=>{noise(.8,160,.16,.8);tone(55,.8,'triangle',.07,48)},dust:()=>noise(.18,2600,.035,.7),tick:()=>tone(1400,.04,'square',.03),
 thunk:()=>{tone(70,.18,'sine',.2,40);noise(.08,300,.1)},pok:()=>{noise(.05,3200,.25,2);tone(520,.06,'square',.07,180)},hiss:()=>noise(.9,5200,.04,.5),
 good:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.5,'triangle',.07),i*90))},plain:()=>{tone(330,.35,'triangle',.06);setTimeout(()=>tone(262,.5,'triangle',.06),140)},bad:()=>{tone(110,.5,'sawtooth',.09,55);noise(.3,200,.14)}};
function sfx(k){if(Q.get('mute'))return;try{SFX[k]&&SFX[k]()}catch(e){}}
function hap(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
// --- the register on the context sheet
function drawSheet(){const t=T();$('.site').innerHTML='<span>SITE GG-26</span><span>'+t.site+'</span>';$('.sheet h2').innerHTML='<span>'+t.h2[0]+'</span><span>'+t.h2[1]+'</span>';
 $('.reg').innerHTML=t.rows.map(r=>'<li data-k="'+r.k+'"><i style="background:'+r.col+'"></i>'+r.n+'<b>'+r.p+'%</b><s></s></li>').join('')}
function narrow(keep){ // strike what the evidence rules out and pencil in the revised chances (honest: real conditional chances)
 const rows=T().rows,tot=rows.filter(r=>keep(r)).reduce((a,r)=>a+r.p,0);
 rows.forEach(r=>{const li=$('.reg li[data-k="'+r.k+'"]');if(!keep(r))li.classList.add('out');else{const b=li.querySelector('b'),n=Math.round(r.p/tot*100);if(n!==r.p&&!li.querySelector('em')){b.style.textDecoration='line-through';b.style.opacity=.55;b.insertAdjacentHTML('afterend','<em>'+n+'%</em>')}else if(li.querySelector('em'))li.querySelector('em').textContent=n+'%'}})}
function hit(k){T().rows.forEach(r=>{const li=$('.reg li[data-k="'+r.k+'"]');if(r.k===k){li.classList.remove('out');li.classList.add('hit')}else li.classList.add('out')})}
function showTag(r,no){const good=r.k==='relic'||r.k==='memory'||r.k==='points'||r.k==='ore',bad=r.k==='mimic';
 const t=$('.tag');t.style.setProperty('--tc',r.col);t.innerHTML='<u>FIND No. '+(no||214)+'</u><svg class="ico" viewBox="0 0 72 72">'+pix(r.k,6)+'</svg><b>'+r.t+'</b><span>'+r.d+'</span><i class="stamp">'+(bad?'HAZARD':r.k==='nothing'||r.k==='bones'?'RECORDED':'BAGGED')+'</i>';
 t.classList.add('show');sfx('thunk');setTimeout(()=>sfx(bad?'bad':good?'good':'plain'),260);hap(bad?[40,40,120]:good?[15,40,15,40,30]:[20]);hit(r.k);
 if(bad)$('.stage').classList.add('shake')}
function cap(s){$('.cap').textContent=s}
function modeBtn(){const b=$('#mode');b.textContent=MODE==='sarc'?'SARCOPHAGUS':'4TH FEVER';b.classList.toggle('on',MODE==='fever')}

// DIRECTION C: READ THE BONE. An oracle bone: heat the pit, the crack runs, the diviner reads where it ends.
const LABELS=[['HEAT THE PIT','bronze rod, held steady'],['WAIT FOR THE CRACK','it comes with a sound'],['READ IT','follow the crack to its end']];
const SLOT=[52,116,180,244,308];let pos={},forkX=0;
function jag(pts){let d='';for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1];for(let k=(i?1:0);k<=6;k++){const t=k/6,x=x0+(x1-x0)*t+(k%6?(Math.random()-.5)*9:0),y=y0+(y1-y0)*t+(k%6?(Math.random()-.5)*5:0);d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}}return d}
function reset(){
 $('#ttl').textContent=MODE==='sarc'?'Before the lid: the bone is asked':'Fourth Fever: the bone is asked again';
 $('#note').textContent='Shang diviners heated a pit drilled in an ox shoulder blade and read the crack. Chances as recorded; the answer is in the bone before the rod touches it.';
 cap(MODE==='sarc'?'The Quartermaster hands you an ox shoulder blade, a bronze rod and a look. Heat the pit.':'Fourth Fever of the dig. The Quartermaster has kept a second bone back. Heat the pit.');
 const rows=T().rows,L=rows.filter(r=>r.side==='L'),R=rows.filter(r=>r.side==='R');pos={};L.forEach((r,i)=>pos[r.k]=SLOT[i]);R.forEach((r,i)=>pos[r.k]=SLOT[5-R.length+i]);
 forkX=RES.side==='L'?118:242;
 let med='';rows.forEach(r=>{const x=pos[r.k];med+='<g id="m_'+r.k+'"><circle cx="'+x+'" cy="112" r="27" fill="#d9cba6" stroke="#8c7748" stroke-width="2"/><circle class="ring" cx="'+x+'" cy="112" r="27" fill="none" stroke="'+r.col+'" stroke-width="4" opacity="0" style="transition:opacity .4s"/><g class="carv" style="transition:opacity .4s">'+pix(r.k,3,x-18,94,'#5a4526')+'</g><g class="colr" opacity="0" style="transition:opacity .4s">'+pix(r.k,3,x-18,94)+'</g><text x="'+x+'" y="158" text-anchor="middle" font-family="Alegreya,serif" font-style="italic" font-size="13" fill="#4a3a22">'+r.n.replace(/^A /,'').replace(/^./,c=>c.toUpperCase())+'</text></g>'});
 const trunk=jag([[180,356],[176,318],[183,286],[180,262]]),fork=jag([[180,262],[forkX+(RES.side==='L'?26:-26),236],[forkX,214]]),end=jag([[forkX,214],[(forkX+pos[RES.k])/2+6,186],[pos[RES.k],142]]);
 $('#scene').innerHTML='<svg viewBox="0 0 360 440" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="lg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd66e" stop-opacity=".5"/><stop offset="1" stop-color="#e0a040" stop-opacity="0"/></radialGradient><radialGradient id="hot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b0"/><stop offset=".4" stop-color="#ff7a2e"/><stop offset="1" stop-color="#ff3d1e" stop-opacity="0"/></radialGradient><filter id="bl"><feGaussianBlur stdDeviation="6"/></filter></defs>'
 +'<rect width="360" height="440" fill="#17110c"/><g class="pix" opacity=".5">'+[0,1,2,3,4,5,6,7].map(i=>'<rect x="0" y="'+(i*56+10)+'" width="360" height="2" fill="#241a12"/>').join('')+'</g><circle class="flick" cx="60" cy="60" r="210" fill="url(#lg)"/>'
 +'<path d="M22 70 Q180 30 338 70 Q346 150 300 250 Q262 330 232 398 Q180 420 128 398 Q98 330 60 250 Q14 150 22 70Z" fill="#e9dfc6" stroke="#8c7748" stroke-width="3"/><path d="M40 84 Q180 50 320 84" fill="none" stroke="#fff8e4" stroke-width="3" opacity=".7"/><path d="M300 250 Q262 330 232 398 Q180 420 128 398" fill="none" stroke="#b9a274" stroke-width="5" opacity=".6"/>'
 +'<g opacity=".35" stroke="#8c7748" stroke-width="1.5">'+[70,150,210,290].map(x=>'<path d="M'+x+' 176 l0 '+(30+x%40)+'" />').join('')+'</g>'
 +med
 +'<circle cx="180" cy="358" r="12" fill="#3a2a1b"/><circle cx="180" cy="358" r="7" fill="#17110c"/><circle id="heat" cx="180" cy="358" r="4" fill="url(#hot)" opacity="0" style="transition:r 1s ease-in,opacity .3s"/>'
 +'<g fill="none" stroke="#2b1d10" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path id="c1" d="'+trunk+'" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path id="c2" d="'+fork+'" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path id="c3" d="'+end+'" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g>'
 +'<g id="rod" style="transition:transform .5s cubic-bezier(.3,1.3,.5,1)" transform="translate(120,90)"><rect x="176" y="352" width="150" height="8" rx="2" fill="#7d5f22" transform="rotate(-32 180 358)"/><rect x="176" y="352" width="34" height="8" rx="2" fill="#ff9a1f" transform="rotate(-32 180 358)"/><rect x="290" y="349" width="40" height="14" rx="3" fill="#4a3521" transform="rotate(-32 180 358)"/></g></svg>';
}
function draw(id,ms){const p=$('#'+id);p.style.transition='stroke-dashoffset '+ms+'ms cubic-bezier(.2,.7,.3,1)';p.getBoundingClientRect();p.style.strokeDashoffset=0}
function act(i){
 if(i===0){$('#rod').style.transform='translate(0,0)';const h=$('#heat');h.style.opacity=1;h.setAttribute('r',26);sfx('hiss');hap([8,60,8,60,12,60,16]);cap('The rod goes in. The bone smells of the kitchen. Nothing yet.')}
 if(i===1){sfx('pok');hap([40,30,20]);$('#stage').classList.add('shake');setTimeout(()=>$('#stage').classList.remove('shake'),500);draw('c1',RM()?1:260);setTimeout(()=>{draw('c2',RM()?1:380);sfx('tick')},RM()?0:300);
  narrow(r=>r.side===RES.side);const n=T().rows.filter(r=>r.side!==RES.side).length;cap('Pok. The crack forks '+(RES.side==='L'?'left':'right')+'. '+n+' answers are off the bone; the register is revised.');$('#note').textContent='Evidence so far: which way the crack forked. The red lines are what it cannot be; the red figures are the chances that remain.'}
 if(i===2){$('#rod').style.transform='translate(120px,90px)';$('#heat').style.opacity=.3;draw('c3',RM()?1:900);sfx('tick');setTimeout(()=>sfx('tick'),300);setTimeout(()=>sfx('pok'),RM()?0:820);hap([6,120,6,120,30]);
  setTimeout(()=>{const m=$('#m_'+RES.k);m.querySelector('.ring').style.opacity=1;m.querySelector('.colr').style.opacity=1;m.querySelector('.carv').style.opacity=0;cap('The crack ends at: '+RES.n.toLowerCase()+'. The lid agrees.')},RM()?0:900);
  setTimeout(()=>showTag(RES),RM()?10:1500)}
}

// shared wiring
let STEP=0,RES=null;
function setAct(i){const b=$('#act'),L=LABELS[i];if(!L){b.disabled=true;b.innerHTML='DONE<small>tap Again</small>';return}b.disabled=false;b.innerHTML=L[0]+'<small>'+L[1]+'</small>'}
function resetAll(){STEP=0;RES=roll();$('.tag').className='tag';$('.tag').innerHTML='';$('.stage').classList.remove('shake');drawSheet();modeBtn();reset();setAct(0)}
$('#act').onclick=()=>{ac();if(STEP>=LABELS.length)return;act(STEP);STEP++;setAct(STEP)};
$('#again').onclick=resetAll;
$('#mode').onclick=()=>{MODE=MODE==='sarc'?'fever':'sarc';if(FORCE&&!T().rows.find(r=>r.k===FORCE)){FORCE=null;$('#force').textContent='NEXT: RANDOM'}resetAll()};
$('#force').onclick=()=>{const ks=[null].concat(T().rows.map(r=>r.k));FORCE=ks[(ks.indexOf(FORCE)+1)%ks.length];$('#force').textContent='NEXT: '+(FORCE||'random').toUpperCase();resetAll()};
if(FORCE)$('#force').textContent='NEXT: '+FORCE.toUpperCase();
window.go=n=>{for(let i=0;i<n;i++)$('#act').click()};
resetAll();if(Q.get('step'))setTimeout(()=>go(+Q.get('step')),50);
</script></body></html>
